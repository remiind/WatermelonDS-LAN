name: WatermelonDS-LAN Build

# Builds an optimized APK of the LAN fork on every push and publishes it as the
# pre-release "lan-latest", so it can be downloaded directly on the handheld.
# The app id gets the ".nightly" suffix, so it installs next to a regular
# WatermelonDS without touching its data.

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lan-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'SapphireRhodonite/WatermelonDS'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          # gradle/gradle-daemon-jvm.properties asks for a JetBrains JDK 21; provide it
          # directly so Gradle does not have to provision one from foojay.
          java-version: '21'
          distribution: jetbrains
          cache: gradle

      # The runner image ships the Android SDK; only make sure the exact NDK,
      # CMake and platform used by this project are present.
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Build APK
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          sed -i -e 's/\(versionName = "\)\(.*\)\("\)/\1\2 LAN ('"$COMMIT"')\3/g' buildSrc/src/main/kotlin/AppConfig.kt
          # Throwaway test key committed to this fork (see README). It only keeps
          # updates installable over each other; it protects nothing.
          echo "MELONDS_KEYSTORE=$GITHUB_WORKSPACE/.github/lan/lan-test.keystore" >> local.properties
          echo "MELONDS_KEYSTORE_PASSWORD=lantest123" >> local.properties
          echo "MELONDS_KEY_ALIAS=lantest" >> local.properties
          echo "MELONDS_KEY_PASSWORD=lantest123" >> local.properties
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME :app:regenerateVulkanSpirv :app:assembleGitHubNightlyRelease :app:assembleGitHubProdRelease --stacktrace 2>&1 | tee build.log
          mkdir -p out
          cp app/build/outputs/apk/gitHubNightly/release/app-gitHub-nightly-release.apk out/WatermelonDS-LAN.apk
          mkdir -p out-personal
          cp app/build/outputs/apk/gitHubProd/release/app-gitHub-prod-release.apk out-personal/WatermelonDS-LAN-original-app-id.apk

      # Surface the relevant part of a failed build as annotations, which can be
      # read through the GitHub API without downloading the full log.
      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          lines = open("build.log", errors="replace").read().splitlines()
          keys = re.compile(r"(error:|error |e: |FAILED|What went wrong|Exception|undefined reference|fatal)", re.I)
          hits = [i for i, l in enumerate(lines) if keys.search(l)]
          blocks, used = [], set()
          for i in hits:
              if i in used:
                  continue
              chunk = lines[max(0, i - 2): i + 6]
              used.update(range(max(0, i - 2), i + 6))
              blocks.append("\n".join(chunk))
              if len(blocks) >= 9:
                  break
          blocks.append("\n".join(lines[-40:]))
          for b in blocks:
              msg = b[:3500].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=build::{msg}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: WatermelonDS-LAN-apk
          path: out/WatermelonDS-LAN.apk

      # Personal variant with the upstream app id (me.magnum.melondualds), so
      # frontends that only know WatermelonDS can launch it. It requires
      # uninstalling the official app first (different signature). Deliberately
      # NOT published as a release, to avoid confusion with the official app.
      - uses: actions/upload-artifact@v4
        with:
          name: WatermelonDS-LAN-original-app-id
          path: out-personal/WatermelonDS-LAN-original-app-id.apk
          retention-days: 7

      - name: Publish pre-release
        if: github.ref == 'refs/heads/Develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f lan-latest
          git push -f origin refs/tags/lan-latest
          gh release delete lan-latest --yes || true
          gh release create lan-latest out/WatermelonDS-LAN.apk \
            --prerelease \
            --title "WatermelonDS-LAN (latest test build)" \
            --notes "Unofficial test build with LAN multiplayer. Commit: $(git rev-parse --short HEAD). Installs next to the regular WatermelonDS (app id suffix .nightly)."
